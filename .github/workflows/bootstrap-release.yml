name: Bootstrap MistUI v4.0.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct release
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* > /tmp/mist_payload.b64
          base64 -d /tmp/mist_payload.b64 > /tmp/mist_payload.tar.xz
          tar -xJf /tmp/mist_payload.tar.xz -C .
          rm -rf .bootstrap

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git commit -m "release: publish MistUI v4.0.0 Stable"
          git push
