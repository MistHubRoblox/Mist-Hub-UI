name: Optimize sidebar tab switching

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/optimize-sidebar-tabs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache sidebar tabs instead of rebuilding them
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('src/03_window_settings.luau.part'),
              Path('dist/MistUI.lua'),
          ]

          new_refresh = "\n".join([
              "    local function refreshDividers()",
              "        local minOrder = math.huge",
              "        local visibleCount = 0",
              "",
              "        for _, t in ipairs(self_.Tabs) do",
              "            local visible = t._btn and t._btn.Visible == true",
              "            if visible then",
              "                visibleCount += 1",
              "                if t._order and t._order < minOrder then",
              "                    minOrder = t._order",
              "                end",
              "            end",
              "        end",
              "",
              "        for _, t in ipairs(self_.Tabs) do",
              "            if t._dividerBefore then",
              "                local visible = t._btn and t._btn.Visible == true",
              "                t._dividerBefore.Visible = visible",
              "                    and visibleCount > 1",
              "                    and t._order ~= minOrder",
              "            end",
              "        end",
              "    end",
              "    self_._refreshDividers = refreshDividers",
          ])

          new_enforce = "\n".join([
              "    function self_:_EnforceSingleSidebarItem(category, ownerKey)",
              "        -- Sidebar pages are lazy-built once and then cached. Switching",
              "        -- groups only changes visibility, avoiding repeated component,",
              "        -- icon, layout and event construction on every click.",
              "        for _, t in ipairs(self_.Tabs) do",
              "            local sameOwner = t.Category == category",
              "                and t.OwnerKey == ownerKey",
              "",
              "            if t._btn and t._btn.Parent then",
              "                t._btn.Visible = sameOwner",
              "            end",
              "",
              "            if t._dividerBefore and t._dividerBefore.Parent then",
              "                t._dividerBefore.Visible = false",
              "            end",
              "",
              "            local tabPage = rawget(t, \"Page\")",
              "            if tabPage then",
              "                tabPage.Visible = sameOwner and self_._activeTab == t",
              "            end",
              "        end",
              "",
              "        self_._activeCategory = category",
              "        refreshDividers()",
              "    end",
          ])

          old_select = "\n".join([
              "        for _, tab in ipairs(self_.Tabs) do",
              "            if tab.Name == name then",
              "                selectTab(tab)",
              "                return tab",
              "            end",
              "        end",
          ])

          new_select = "\n".join([
              "        for _, tab in ipairs(self_.Tabs) do",
              "            if tab.Name == name then",
              "                if tab.Category then",
              "                    self_:_EnforceSingleSidebarItem(",
              "                        tab.Category,",
              "                        tab.OwnerKey",
              "                    )",
              "                end",
              "                selectTab(tab)",
              "                return tab",
              "            end",
              "        end",
          ])

          refresh_pattern = re.compile(
              r'(?ms)^    local function refreshDividers\(\)\n.*?^    end\n    self_\._refreshDividers = refreshDividers'
          )
          enforce_pattern = re.compile(
              r'(?ms)^    function self_:_EnforceSingleSidebarItem\(category, ownerKey\)\n.*?^    end(?=\n\n    -- Creates \(or focuses\) a tab from a sidebar item\.)'
          )

          for path in files:
              text = path.read_text(encoding='utf-8')

              text, count = refresh_pattern.subn(new_refresh, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: refreshDividers patch found {count} matches')

              text, count = enforce_pattern.subn(new_enforce, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: _EnforceSingleSidebarItem patch found {count} matches')

              count = text.count(old_select)
              if count != 1:
                  raise SystemExit(f'{path}: SelectTab patch found {count} matches')
              text = text.replace(old_select, new_select, 1)

              path.write_text(text, encoding='utf-8')
              print(f'patched {path}')
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/optimize-sidebar-tabs.yml

      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "Mist Hub Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/03_window_settings.luau.part dist/MistUI.lua
          git commit -m "perf: cache sidebar tabs instead of rebuilding"
          git push
